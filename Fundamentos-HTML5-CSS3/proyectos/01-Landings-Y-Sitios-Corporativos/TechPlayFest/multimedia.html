    <style>

        * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100vh;
        overflow: hidden;
        font-family: Arial, sans-serif;
        display: grid;
        grid-template-rows: auto 1fr auto;
    }

        header {
        color: white;
        background-color: black;
        display: flex;
        justify-content: space-around;
        align-items: center;
        padding: 20px;
    }

    header > nav ul {
        display: flex;
    }

    header > nav ul li {
        margin-right: 20px;
        list-style: none;
    }

    header > nav ul li a {
        color: white;
        text-decoration: none;
    }

    header > nav ul li a:hover {
        color: green;
    }

    main {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 2em;
    }

    main > video {
        width: 400px;
    }

    footer {
        width: 100%;
        height: 60px;
        background-color: black;
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px;
    }

    footer a {
        color: white;
        text-decoration: none;
    }

    footer a:hover {
        color: grey;
    }
/* Media query para móviles */
@media (max-width: 400px) {
    body{
         width: 100%;
    }
    header {
        flex-direction: column;
        text-align: center;
    }
    main {
        width:100%;
    }
    nav ul {
        flex-direction: column;
    }

    img, video, audio {
        width: 100%;
    }
    p {
        width: 100%;
    }
footer{
font-size:0.6em;
}
}

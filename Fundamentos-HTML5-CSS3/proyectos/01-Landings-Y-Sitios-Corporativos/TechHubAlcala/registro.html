<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechHub | Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>TechHub <span>_Alcalá</span></h1>
        <nav>
            <ul>
                <li><a href="index.html">/dashboard</a></li>
                <li><a href="multimedia.html">/media</a></li>
                <li><a href="registro.html" class="activo">/join</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>new_user_registration.exe</h2>

        <form action="http://www.google.com">
            
            <label for="user">Username / Full Name:</label>
            <input type="text" id="user" name="user" required placeholder="john_doe">

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required placeholder="dev@company.com">

            <label for="stack">Primary Stack / Role:</label>
            <select id="stack" name="stack">
                <option>Full Stack Developer</option>
                <option>Frontend (React/Vue)</option>
                <option>Backend (Node/Python)</option>
                <option>Data Scientist</option>
                <option>UI/UX Designer</option>
            </select>

            <label for="plan">Select Plan:</label>
            <div>
                <input type="radio" id="hotdesk" name="plan" value="hot" checked>
                <label for="hotdesk" style="display:inline;">Hot Desk (Flexible)</label>
            </div>
            <div>
                <input type="radio" id="fixed" name="plan" value="fixed">
                <label for="fixed" style="display:inline;">Fixed Desk (24/7 Access)</label>
            </div>

            <label style="margin-top: 20px;">
                <input type="checkbox" required> I accept terms_of_service.txt
            </label>

            <input type="submit" value="> EXECUTE REGISTRATION">
        </form>
    </main>

    <footer>
        <p>System v.2.0.4</p>
        <p>Network: <span style="color:#2ecc71">● Online</span></p>
    </footer>

</body>
</html>

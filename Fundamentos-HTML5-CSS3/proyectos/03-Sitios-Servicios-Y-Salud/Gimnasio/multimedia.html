<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia | Gimnasio Hércules</title>
    <link rel="icon" href="favicon.png">
    
    <link rel="stylesheet" href="style.css">

    <style>
        /* ESTILOS ESPECÍFICOS DE MULTIMEDIA */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden; /* Evita scroll si no hace falta */
            font-family: Arial, sans-serif;
            display: grid;
            grid-template-rows: auto 1fr auto;
        }

        header {
            color: white;
            background-color: black;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 20px;
            border-bottom: 3px solid #cc0000; /* Detalle rojo */
        }

        header > nav ul { display: flex; }
        header > nav ul li { margin-right: 20px; list-style: none; }

        header > nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Hover en Rojo Gym */
        header > nav ul li a:hover { color: #cc0000; }

        main {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 2em;
            background-color: #f4f4f4;
        }

        main > h2 {
            font-size: 2em;
            text-transform: uppercase;
            color: #333;
        }

        main > h3 {
            color: #cc0000; /* Títulos en rojo */
        }

        main > video {
            width: 400px;
            border: 5px solid black;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        footer {
            width: 100%;
            height: 60px;
            background-color: black;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            font-size: 0.9em;
            border-top: 3px solid #cc0000;
        }
        footer a { color: white; text-decoration: none; }
        footer a:hover { color: #cc0000; }

        /* Media query para móviles */
        @media (max-width: 600px) {
            body { width: 100%; overflow-y: auto; }
            header { flex-direction: column; text-align: center; gap: 10px; }
            main { width: 100%; padding: 20px; }
            nav ul { flex-direction: column; gap: 5px; }
            img, video, audio { width: 100%; max-width: 400px; }
            footer { font-size: 0.6em; flex-direction: column; gap: 5px; }
        }
    </style>

</head>
<body>

    <header>
        <a href="index.html" style="color: white; text-decoration: none;">
            <h1>Gimnasio Hércules</h1>
        </a>
        
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="multimedia.html" style="color:#cc0000;">Multimedia</a></li>
                <li><a href="programa.html">Programa</a></li>
                <li><a href="registro.html">Registro</a></li>
            </ul>
        </nav>

    </header>

    <main>
        <h2>Zona de Entrenamiento</h2>
        
        <h3>Tour Virtual de las Instalaciones</h3>
        <video controls src="video.mp4" type="video/mp4" poster="festival.png">
            Tu navegador no soporta videos.
        </video>
        
        <h3>Podcast: Motivación y Nutrición</h3>
        <audio controls src="intro.mp3" type="audio/mpeg">
            Tu navegador no soporta audio.
        </audio>
    </main>

    <footer>
        <p>&copy; Gimnasio Hércules 2025</p>
        <p>Asignatura Lenguaje de Marcas - IES Isidra de Guzman (Alcalá de Henares)</p>
        <div class="contacto">
            <a href="mailto:info@gymhercules.com">info@gymhercules.com</a>
        </div>
    </footer>
</body>
</html>

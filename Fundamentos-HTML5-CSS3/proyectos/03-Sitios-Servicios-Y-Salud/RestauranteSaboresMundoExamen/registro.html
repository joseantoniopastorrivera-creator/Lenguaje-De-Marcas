<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="JOSÉ ANTONIO PASTOR RIVERA">
    <title>Registro | Sabores del Mundo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Restaurante Sabores del Mundo</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="multimedia.html">Multimedia</a></li>
                <li><a href="registro.html">Registro</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Regístrate como cliente</h2>

        <form action="http://www.google.com">

            <label for="nombre">* Nombre:</label>
            <input type="text" id="nombre" name="nombre" required> <label for="email">* Correo Electrónico:</label>
            <input type="email" id="email" name="email" required placeholder="ejemplo@correo.com"> <label for="fecha">*
                Fecha de nacimiento:</label>
            <input type="date" id="fecha" name="fecha" min="1950-01-01" value="2005-01-01" required>

            <label for="comida">* Mi comida favorita:</label>
            <select id="comida" name="comida" required>
                <option value="paella">Paella española</option>
                <option value="cocido">Cocido madrileño</option>
                <option value="pasta">Pasta italiana</option>
                <option value="pizza">Pizza italiana</option>
                <option value="sushi">Sushi japonés</option>
                <option value="tacos">Tacos mexicanos</option>
                <option value="curry">Curry tailandés</option>
            </select>

            <p>¿Has venido a nuestro restaurante?</p>
            <div>
                <input type="radio" id="si" name="visitado" value="si">
                <label for="si">Si</label>
                <input type="radio" id="no" name="visitado" value="no" checked>
                <label for="no">No</label>
            </div>

            <p>Preferencias:</p>
            <div>
                <input type="checkbox" id="news" name="newsletter">
                <label for="news">Recibir newsletter</label>
            </div>
            <div>
                <input type="checkbox" id="promo" name="promociones">
                <label for="promo">Promociones</label>
            </div>

            <div style="margin-top: 10px;">
                <input type="checkbox" id="terms" name="terminos" required>
                <label for="terms">* Acepto los términos y condiciones</label>
            </div>

            <input type="submit" value="Enviar">
        </form>
    </main>

    <footer>
        <p>&copy; Examen de Recuperación</p>
        <p>Asignatura Lenguaje de Marcas - IES Isidra de Guzman (Alcalá de Henares)</p>
        <div class="contacto">
            <a href="mailto:ies.isidra.guzman@correo.com">ies.isidra.guzman@correo.com</a>
            <a href="#">Alcalá de Henares</a>
        </div>
    </footer>

</body>

</html>
